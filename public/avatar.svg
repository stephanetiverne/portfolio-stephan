  <!-- Sourire -->
  <path d="M88 102c6 6 18 6 24 0" stroke="#2c2c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Lunettes -->
  <rect x="74" y="80" width="24" height="16" rx="6" fill="none" stroke="#1e5fd4" stroke-width="3"/>
  <rect x="102" y="80" width="24" height="16" rx="6" fill="none" stroke="#1e5fd4" stroke-width="3"/>
  <line x1="98" y1="88" x2="102" y2="88" stroke="#1e5fd4" stroke-width="3"/>
  <!-- Motifs décoratifs -->
  <circle cx="24" cy="24" r="6" fill="#ffffff" opacity="0.25"/>
  <circle cx="180" cy="32" r="10" fill="#ffffff" opacity="0.15"/>
